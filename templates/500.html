{% extends "base.html" %} {% block title %}Server Error - Goodness Grid{%
endblock %} {% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="empty-state">
        <div class="empty-state-icon" style="font-size: 6rem">
          <i class="bi bi-exclamation-triangle-fill text-danger"></i>
        </div>
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h2 class="fw-semibold mb-3">Internal Server Error</h2>
        <p class="text-muted mb-4 fs-5">
          Oops! Something went wrong on our end. We're working to fix it.
        </p>
        <div class="d-grid gap-2 d-md-block">
          <a href="/" class="btn btn-danger btn-lg rounded-pill px-4"
            >Go to Homepage</a
          >
          <a
            href="javascript:history.back()"
            class="btn btn-outline-danger btn-lg rounded-pill px-4"
            >Go Back</a
          >
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
