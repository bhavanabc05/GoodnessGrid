{% extends "base.html" %} {% block title %}Page Not Found - Goodness Grid{%
endblock %} {% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="empty-state">
        <div class="empty-state-icon" style="font-size: 6rem">
          <i class="bi bi-compass-fill"></i>
        </div>
        <h1 class="display-1 fw-bold text-success">404</h1>
        <h2 class="fw-semibold mb-3">Page Not Found</h2>
        <p class="text-muted mb-4 fs-5">
          Sorry, the page you're looking for doesn't exist or has been moved.
        </p>
        <div class="d-grid gap-2 d-md-block">
          <a href="/" class="btn btn-success btn-lg rounded-pill px-4"
            >Go to Homepage</a
          >
          {% if session.email %}
          <a
            href="/dashboard"
            class="btn btn-outline-success btn-lg rounded-pill px-4"
            >Go to Dashboard</a
          >
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
